<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浏览器版本过低</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f5f7fa;
        color: #222;
        font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      .page {
        width: 100%;
        min-height: 100vh;
      }

      .container {
        width: 92%;
        max-width: 640px;
        margin: 48px auto;
        padding: 28px 24px;
        background: #fff;
        border: 1px solid #d7dbe2;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 26px;
        line-height: 1.35;
      }

      p {
        margin: 10px 0;
        line-height: 1.7;
        font-size: 15px;
      }

      ul {
        margin: 14px 0 0 20px;
        padding: 0;
      }

      li {
        margin: 8px 0;
        line-height: 1.7;
        font-size: 15px;
      }

      a {
        color: #1558d6;
        text-decoration: underline;
      }

      .footer {
        margin-top: 18px;
        color: #666;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="container">
        <h1>当前浏览器版本过低</h1>
        <p>很抱歉，当前浏览器无法正常访问本网站。</p>
        <p>请升级到较新的浏览器后再访问：</p>
        <ul>
          <li><a href="https://www.google.cn/chrome/" target="_blank" rel="noopener">Google Chrome</a></li>
          <li><a href="https://www.microsoft.com/edge" target="_blank" rel="noopener">Microsoft Edge</a></li>
          <li><a href="https://www.mozilla.org/firefox/new/" target="_blank" rel="noopener">Mozilla Firefox</a></li>
          <li><a href="https://www.apple.com/safari/" target="_blank" rel="noopener">Safari</a></li>
        </ul>
        <p class="footer">升级浏览器后，请刷新本页面重试。</p>
      </div>
    </div>
  </body>
</html>
